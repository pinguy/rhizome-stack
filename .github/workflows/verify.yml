name: Verify sanitised release

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static, privacy and idempotence tests
        run: python3 tests/test_static.py
      - name: Import, model selection and preservation regressions
        run: python3 tests/test_behaviour.py
      - name: Install memory storage test dependencies
        run: python3 -m pip install numpy==2.3.5 faiss-cpu==1.15.0
      - name: Verify real FAISS index generations
        run: python3 tests/test_behaviour.py
