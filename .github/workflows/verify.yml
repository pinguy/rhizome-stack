name: Verify sanitised release

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - name: Install regression test dependencies
        run: python3 -m pip install -r tests/requirements.txt
      - name: Run every bundled regression suite
        run: python3 tools/check.py
      - name: Check whitespace
        run: git diff --check
      - name: Install release compressor
        run: sudo apt-get update && sudo apt-get install -y zstd
      - name: Verify reproducible release archives
        shell: bash
        run: |
          python3 tools/build_release.py --output-root "$RUNNER_TEMP/rhizome-build-a"
          python3 tools/build_release.py --output-root "$RUNNER_TEMP/rhizome-build-b"
          version="$(cat VERSION)"
          cmp "$RUNNER_TEMP/rhizome-build-a/$version/rhizome-stack.tar.zst" "$RUNNER_TEMP/rhizome-build-b/$version/rhizome-stack.tar.zst"
          cmp "$RUNNER_TEMP/rhizome-build-a/$version/rhizome-stack.zip" "$RUNNER_TEMP/rhizome-build-b/$version/rhizome-stack.zip"
